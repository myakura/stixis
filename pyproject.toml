[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stixis"
version = "0.1.0"
description = "Spec-driven CSS serializer and validator generated from W3C @webref/css and Web Platform Tests"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.115.0",
    "ruff>=0.8.0",
]

[project.scripts]
stixis = "stixis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stixis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["src/stixis/_generated", "tests/_generated"]
