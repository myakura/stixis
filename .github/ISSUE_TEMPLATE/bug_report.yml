name: Bug Report
description: Report a CSS serialization, validation, or microsyntax bug in Stixis
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Isolate the reproduction to `stixis` APIs or CLI commands and run it before submitting.
  - type: textarea
    id: what-happens
    attributes:
      label: What Happens?
      description: Describe the observed behavior, including the affected `stixis` functions or classes (`src/stixis/...`) and the output or exception.
      placeholder: |
        Calling `...` raises / returns `...`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to Reproduce?
      description: Provide a self-contained Python 3.14+ snippet or `stixis check` CLI command using only `stixis`. Every `assert` or comment must match actual runtime output.
      render: python
      placeholder: |
        from stixis import ...

        # Verified runtime output:
        assert ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What Should Happen?
      description: Describe the expected CSS output or validation behavior, citing the relevant W3C CSS specification or WPT test when applicable.
    validations:
      required: true
