name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read baseline upstream commits from codegen/upstream.json
        id: baseline
        run: |
          echo "webref_sha=$(python3 -c 'import json; print(json.load(open("codegen/upstream.json"))["webref"]["commit"])')" >> "$GITHUB_OUTPUT"
          echo "wpt_sha=$(python3 -c 'import json; print(json.load(open("codegen/upstream.json"))["wpt"]["commit"])')" >> "$GITHUB_OUTPUT"
          echo "bcd_sha=$(python3 -c 'import json; print(json.load(open("codegen/upstream.json"))["bcd"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Sparse-checkout w3c/webref at baseline commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: w3c/webref
          ref: ${{ steps.baseline.outputs.webref_sha }}
          path: .upstream/webref
          sparse-checkout: |
            ed/css

      - name: Sparse-checkout web-platform-tests/wpt at baseline commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: web-platform-tests/wpt
          ref: ${{ steps.baseline.outputs.wpt_sha }}
          path: .upstream/wpt
          sparse-checkout: |
            css

      - name: Sparse-checkout mdn/browser-compat-data at baseline commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdn/browser-compat-data
          ref: ${{ steps.baseline.outputs.bcd_sha }}
          path: .upstream/bcd
          sparse-checkout: |
            css

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Verify generated files are current against baseline upstream commits
        run: |
          uv run python codegen/gen_specs.py --check --webref-dir .upstream/webref/ed/css --bcd-dir .upstream/bcd/css
          uv run python codegen/gen_wpt_tests.py --check --wpt-dir .upstream/wpt/css

      - name: Run pytest suite (WPT + Hypothesis + API/CLI)
        run: uv run pytest

      - name: Build wheel and sdist
        run: uv build
