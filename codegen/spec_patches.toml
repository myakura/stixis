# Declarative patches and merge rules for `@webref/css` (`ed/css/*.json`).
# Consumed by `codegen/gen_specs.py` to generate `src/stixis/_generated/`.

[meta]
webref_css_dir = "resources/specs/w3c/webref/ed/css"
bcd_css_dir = "resources/data/browser-compat-data/css"

# Browser implementation threshold (`@mdn/browser-compat-data` engines: Blink, Gecko, WebKit):
#   3 = Baseline Newly/Widely available (all 3 engines)
#   2 = Stable multi-engine (default; avoids single-browser prototype churn)
#   1 = Single-engine prototype included (or opt in per property via `allow_properties` / `SerializationOptions.extra_properties`)
#   0 = All Editor's Draft specs included (including unimplemented Spec Fiction)
[support]
default_min_engines = 2
allow_properties = [
    "font-width",
    "font-stretch",
    "font-synthesis-position",
]
exclude_specs = [
    "css-color-6.json",
    "css-conditional-values.json",
    "svg-strokes.json",
]

# Additional container query and speech units defined in prose or pending reffy extraction
[extra_units]
"<length>" = ["cqw", "cqh", "cqi", "cqb", "cqmin", "cqmax"]
"<decibel>" = ["dB"]
"<semitones>" = ["st"]

# Superseded umbrella/legacy specs merged before main specs, plus explicit owner-superseding rules
[delta_merges]
order = [
    "CSS.json",
    "fill-stroke.json",
    "css-logical.json",
    "css-gcpm.json",
    "css-flexbox.json",
]

[delta_merges.supersedes]
"SVG.json" = ["fill-stroke.json"]
"css-align.json" = ["css-flexbox.json"]
"css-borders.json" = ["css-logical.json"]
"css-content.json" = ["css-gcpm.json"]
"css-images-4.json" = ["css-gcpm.json"]
"css-position.json" = ["css-logical.json"]
"css-sizing.json" = ["css-logical.json"]

# Prose-defined or missing non-terminal value definitions (`<type>`)
[values]
"<font-src-list>" = "<font-src>#"
"<family-name>" = "<string> | <custom-ident>+"
"<generic-family>" = "<generic-font-family>"
"<palette-identifier>" = "<dashed-ident>"
"<counter-name>" = "<custom-ident>"
"<counter-style-name>" = "<custom-ident>"
"<timeline-range-name>" = "cover | contain | entry | exit | entry-crossing | exit-crossing | <custom-ident>"
"<timeline-range-center-subject>" = "source | target"
"<custom-property-name>" = "<dashed-ident>"
"<extension-name>" = "<dashed-ident>"
"<target-name>" = "<string>"
"<id>" = "<id-selector>"
"<url-modifier>" = "<ident> | <function-token> <any-value> )"
"<outline-line-style>" = "auto | <line-style>"
"<voice-family-name>" = "<string> | <custom-ident>+"
"<age>" = "child | young | old"
"<gender>" = "male | female | neutral"
"<page-size>" = "A5 | A4 | A3 | B5 | B4 | JIS-B5 | JIS-B4 | letter | legal | ledger"
"<size-keyword>" = "<custom-ident>"
"<url-set>" = "<image-set()>"
"<transform-function>" = "matrix( <number>#{6} ) | translate( <length-percentage> , <length-percentage>? ) | translateX( <length-percentage> ) | translateY( <length-percentage> ) | scale( [ <number> | <percentage> ]#{1,2} ) | scaleX( <number> | <percentage> ) | scaleY( <number> | <percentage> ) | rotate( [ <angle> | <zero> ] ) | skew( [ <angle> | <zero> ] , [ <angle> | <zero> ]? ) | skewX( [ <angle> | <zero> ] ) | skewY( [ <angle> | <zero> ] ) | matrix3d( <number>#{16} ) | translate3d( <length-percentage> , <length-percentage> , <length> ) | translateZ( <length> ) | scale3d( [ <number> | <percentage> ]#{3} ) | scaleZ( <number> | <percentage> ) | rotate3d( <number> , <number> , <number> , [ <angle> | <zero> ] ) | rotateX( [ <angle> | <zero> ] ) | rotateY( [ <angle> | <zero> ] ) | rotateZ( [ <angle> | <zero> ] ) | perspective( [ <length [0,∞]> | none ] )"
"<whole-value>" = "<declaration-value>"
"<declaration>" = "<declaration-value>"
"<media-query-list>" = "<any-value>"
"<supports-condition-name>" = "<extension-name>"
"<boolean-expr-group>" = "<any-value>"
"<anchored-feature>" = "<any-value>"
"<style-feature-name>" = "<ident>"
"<style-feature-value>" = "<declaration-value>"
"<scroll-state-feature>" = "<any-value>"
"<size-feature>" = "<any-value>"
"<scope-start>" = "<any-value>"
"<scope-end>" = "<any-value>"
"<animation-action>" = "none | play | play-once | play-forwards | play-backwards | pause | reset | replay"
"<quirky-color>" = "<color>"
"<quirky-length>" = "<length>"
"<uri>" = "<url>"
"<view-transition-type>" = "<custom-ident>"
"random()" = "random( [ <random-key> , ]? <calc-sum> , <calc-sum> [ , <calc-sum> ]? )"
"anchor()" = "anchor( [ <anchor-name>? && <anchor-side> ] [ , <length-percentage> ]? )"
"anchor-size()" = "anchor-size() | anchor-size( [ <anchor-name> || <anchor-size> ] [ , <length-percentage> ]? ) | anchor-size( <length-percentage> )"

# Extend `<font-features-tech>` with `avar2` from `css-fonts-5.json`
"<font-features-tech>" = "[ features-opentype | features-aat | features-graphite | avar2 ]"
"<baseline-position>" = "[ first | last ]? baseline"

# At-rule prelude grammars (`ValueNode` validated when present; `"<condition>"` uses token safety)
[atrule_preludes]
"@font-face" = ""
"@font-palette-values" = "<dashed-ident>"
"@font-feature-values" = "<font-family-name>#"
"@property" = "<custom-property-name>#"
"@keyframes" = "<keyframes-name>"
"@counter-style" = "<counter-style-name>"
"@color-profile" = "<dashed-ident> | device-cmyk"
"@position-try" = "<dashed-ident>"
"@layer" = "<layer-name>? | <layer-name>#"
"@view-transition" = ""
"@starting-style" = ""

# Prose-defined descriptor aliases and overrides on at-rules
[atrule_descriptors."@font-face"]
"font-stretch" = "auto | <'font-width'>{1,2}"
"unicode-range" = "<urange>#"

# Property syntax overrides where a Level 4/5 draft broke standard longhand syntax or omitted prose keywords
[properties]
"font-stretch" = "<'font-width'>"
"font-synthesis" = "none | [ weight || [ style | oblique-only ] || small-caps || position ]"
"align-items" = "<overflow-position>? [ normal | <self-position> ] | stretch | <baseline-position>"
"align-self" = "auto | <overflow-position>? [ normal | <self-position> ] | stretch | <baseline-position> | anchor-center"
"justify-items" = "<overflow-position>? [ normal | <self-position> | left | right ] | stretch | <baseline-position> | legacy | legacy && [ left | right | center ]"
"inset-block-start" = "<'top'>"
"inset-block-end" = "<'top'>"
"inset-inline-start" = "<'top'>"
"inset-inline-end" = "<'top'>"
"flex-basis" = "content | auto | <box-size>"

# Relative color channel keywords not listed in `@webref/css` function `values` arrays
# (`rgb()` and `rgba()`: CSS Color 5 §4.2.1; `hsl()` and `hsla()`: CSS Color 5 §4.2.2)
[relative_color_channels]
"rgb" = ["r", "g", "b", "alpha"]
"rgba" = ["r", "g", "b", "alpha"]
"hsl" = ["h", "s", "l", "alpha"]
"hsla" = ["h", "s", "l", "alpha"]
